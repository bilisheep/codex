name: pruning-release

on:
  push:
    tags:
      - "v*tool-output-relevance-pruning*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update"
        required: true
        default: "v0.1.0-tool-output-relevance-pruning"

permissions:
  contents: write

concurrency:
  group: pruning-release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            ext: ""
          - name: linux-x86
            runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
            archive: tar.gz
            ext: ""
          - name: linux-arm64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            ext: ""
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            ext: ".exe"
          - name: windows-x86
            runner: windows-latest
            target: i686-pc-windows-msvc
            archive: zip
            ext: ".exe"
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            ext: ".exe"
          - name: macos-x64
            runner: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
            ext: ""
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            ext: ""

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-i686-linux-gnu \
            libc6-dev-arm64-cross \
            libc6-dev-i386 \
            pkg-config

      - name: Configure Linux cross linker
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
            i686-unknown-linux-gnu)
              echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=i686-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build codex
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}" --bin codex

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          package="codex-${tag}-${{ matrix.name }}"
          dist="${GITHUB_WORKSPACE}/dist/${package}"
          mkdir -p "${dist}"

          cp "target/${{ matrix.target }}/release/codex${{ matrix.ext }}" "${dist}/codex${{ matrix.ext }}"
          "${dist}/codex${{ matrix.ext }}" --version > "${dist}/VERSION.txt" || true
          {
            printf '%s\n\n' 'Codex 工具输出相关性剪枝实验版'
            printf 'Tag: %s\n' "${tag}"
            printf 'Target: %s\n' '${{ matrix.target }}'
            printf 'Platform: %s\n\n' '${{ matrix.name }}'
            printf '%s\n' '功能开关:'
            printf '%s\n' '[tool_output_relevance_pruning]'
            printf '%s\n\n' 'enabled = true'
            printf '%s\n' '说明:'
            printf '%s\n' '这是剪枝分支的自动构建产物，只包含 codex CLI 主二进制。'
          } > "${dist}/README.txt"

          cd "${GITHUB_WORKSPACE}/dist"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${package}.zip" "${package}"
          else
            tar -czf "${package}.tar.gz" "${package}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ matrix.name }}
          path: dist/codex-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          title="Codex 工具输出相关性剪枝 ${TAG}"
          {
            printf '%s\n\n' '## 版本说明'
            printf '%s\n\n' '这是 Codex 工具输出相关性剪枝的实验预发布版本，用于验证 `trim_prompt_context` 对长工具输出历史的后续上下文裁剪效果。'
            printf '%s\n\n' '## 本版包含'
            printf '%s\n' '- 新增可选配置 `[tool_output_relevance_pruning]`。'
            printf '%s\n' '- 新增 `trim_prompt_context` 工具，用于把已经消费且后续不再需要的大型工具输出从提示词历史中剪掉。'
            printf '%s\n' '- 工具输出压缩链路保持关闭，与本版本分离。'
            printf '%s\n\n' '- 自动构建并上传多平台 `codex` CLI 二进制产物。'
            printf '%s\n\n' '## 构建产物'
            printf '%s\n' '- Linux：x64、x86、arm64'
            printf '%s\n' '- Windows：x64、x86、arm64'
            printf '%s\n\n' '- macOS：x64、arm64'
            printf '%s\n\n' '说明：macOS 已不支持 32 位 x86 用户态程序，因此不提供 macOS x86 产物。'
            printf '%s\n\n' '## 使用提示'
            printf '%s\n\n' '在配置中开启：'
            printf '%s\n' '```toml'
            printf '%s\n' '[tool_output_relevance_pruning]'
            printf '%s\n' 'enabled = true'
            printf '%s\n' '```'
          } > release-notes.md

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --repo "${REPO}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "${TAG}" \
              --repo "${REPO}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --prerelease
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/checksums.txt

          gh release upload "${TAG}" dist/*.tar.gz dist/*.zip \
            dist/checksums.txt \
            --repo "${REPO}" \
            --clobber
